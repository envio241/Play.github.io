
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Video News</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff;
  color: #111827;
}

.header {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 25px;
  border-bottom: 1px solid #eee;
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 27px;
  font-weight: bold;
}

.logo-icon {
  width: 60px;
  height: 60px;
  background: #111827;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 14px;
  font-size: 32px;
}

.logo span {
  color: #3984e9;
}

.upload {
  background: #111827;
  color: white;
  border: none;
  border-radius: 25px;
  padding: 18px 30px;
  font-size: 20px;
  font-weight: bold;
}

.container {
  padding: 25px 20px;
}

.advertise {
  font-size: 29px;
  color: #64748b;
  margin-bottom: 65px;
}

.video-card {
  width: 100%;
  max-width: 850px;
  margin: auto;
  position: relative;
  overflow: hidden;
  border-radius: 40px;
  background: #111;
  aspect-ratio: 9 / 16;
  box-shadow: 0 8px 30px rgba(0,0,0,.15);
}

.video-card video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.video-click-area {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  height: 100%;
}

.video-click-area.hidden {
  display: none;
}

.play-button {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  background: rgba(255,255,255,.96);
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 5px 25px rgba(0,0,0,.25);
  transition: transform .2s;
  pointer-events: none;
}

.video-click-area:active .play-button {
  transform: scale(.92);
}

.play-button::before {
  content: "";
  width: 0;
  height: 0;
  border-top: 34px solid transparent;
  border-bottom: 34px solid transparent;
  border-left: 50px solid #000;
  margin-left: 12px;
}

@media(max-width:600px) {
  .header {
    height: 90px;
    padding: 12px 15px;
  }

  .logo {
    font-size: 23px;
  }

  .logo-icon {
    width: 55px;
    height: 55px;
  }

  .upload {
    padding: 15px 22px;
    font-size: 17px;
  }

  .container {
    padding: 25px 15px;
  }

  .advertise {
    font-size: 27px;
    margin-bottom: 60px;
  }

  .video-card {
    border-radius: 35px;
  }

  .play-button {
    width: 150px;
    height: 150px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">V</div>
    <div>vldey<span>.co</span></div>
  </div>

  <button class="upload" type="button">
    Upload
  </button>
</header>

<main class="container">

  <div class="advertise">Advertise</div>

  <div class="video-card">

    <video
      id="myVideo"
      poster="https://cdn.phototourl.com/anon/2026-11-19-d9bda536-a06d-4914-b772-bcde70b58f94.jpg"
      playsinline
      preload="metadata"
    >
      <source
        src="https://videotourl.com/videos/1793932029889-35ad089c-f68d-4c99-a871-1ed86eb70daa.mp4"
        type="video/mp4">
    </video>

    <button
      class="video-click-area"
      id="clickArea"
      type="button"
      aria-label="Putar video">

      <span class="play-button"></span>

    </button>

  </div>

</main>

<script>

/* =================================
   MONETAG DIRECT LINK
================================= */

const MONETAG_LINK =
"https://uplcm.com/4/11810812";

/* =================================
   VIDEO PLAYER
================================= */

const video = document.getElementById("myVideo");
const clickArea = document.getElementById("clickArea");

let sudahKlik = false;

clickArea.addEventListener("click", function() {

  // BUKA IKLAN MONETAG SATU KALI
  // PADA KLIK PERTAMA

  if (!sudahKlik) {

    window.open(
      MONETAG_LINK,
      "_blank",
      "noopener,noreferrer"
    );

    sudahKlik = true;
  }

  // PUTAR VIDEO
  video.play().then(function() {

    clickArea.classList.add("hidden");
    video.controls = true;

  }).catch(function() {

    video.controls = false;
    clickArea.classList.remove("hidden");

    alert("Video gagal diputar. Periksa link MP4.");

  });

});

/* SAAT VIDEO DIPUTAR */

video.addEventListener("play", function() {
  clickArea.classList.add("hidden");
  video.controls = true;
});

/* SAAT VIDEO DIJEDA */

video.addEventListener("pause", function() {

  if (!video.ended) {
    video.controls = false;
    clickArea.classList.remove("hidden");
  }

});

/* SAAT VIDEO SELESAI */

video.addEventListener("ended", function() {

  video.controls = false;
  clickArea.classList.remove("hidden");

});

</script>

</body>
</html>
