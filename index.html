<title>Vldey - Video UPDATE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #111827;
}

header {
  height: 105px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 4%;
  border-bottom: 1px solid #e5e7eb;
}

.logo {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 27px;
  font-weight: bold;
}

.logo-icon {
  width: 60px;
  height: 60px;
  background: #111827;
  color: white;
  border-radius: 13px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.logo span {
  color: #3985e9;
}

.upload {
  background: #111827;
  color: white;
  border: none;
  padding: 20px 30px;
  border-radius: 25px;
  font-size: 18px;
  font-weight: bold;
}

.container {
  padding: 28px 4%;
  max-width: 1100px;
  margin: auto;
}

.advertise {
  font-size: 25px;
  color: #64748b;
  margin-bottom: 35px;
}

.video-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
}

.video-card {
  width: 100%;
  overflow: hidden;
  border-radius: 35px;
  background: white;
  box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

.thumbnail {
  width: 100%;
  aspect-ratio: 9 / 16;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  background: #111;
}

.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 115px;
  height: 115px;
  background: rgba(255,255,255,0.95);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  color: #000;
  padding-left: 7px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  transition: 0.2s;
}

.thumbnail:hover .play-button {
  transform: translate(-50%, -50%) scale(1.1);
}

.video-info {
  padding: 18px;
}

.video-info h3 {
  font-size: 19px;
  margin-bottom: 12px;
}

.watch {
  display: block;
  text-align: center;
  background: #111827;
  color: white;
  padding: 15px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
}

@media(max-width:600px) {
  .video-list {
    grid-template-columns: 1fr;
    gap: 25px;
  }

  header {
    height: 85px;
  }

  .logo {
    font-size: 23px;
  }

  .logo-icon {
    width: 48px;
    height: 48px;
  }

  .upload {
    padding: 15px 20px;
  }

  .play-button {
    width: 105px;
    height: 105px;
    font-size: 43px;
  }
}
</style>
</head>
